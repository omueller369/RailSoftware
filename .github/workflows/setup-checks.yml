name: Ubuntu and Debian setup checks
on:
  push:
    paths: ['setup.sh', 'setup/**', 'backend/**', '.github/workflows/setup-checks.yml']
  pull_request:
    paths: ['setup.sh', 'setup/**', 'backend/**', '.github/workflows/setup-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bash and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          for script in setup.sh setup/*.sh setup/tests/*.sh backend/testenv/prepare.sh backend/testenv/control.sh; do bash -n "$script"; done
          shellcheck -x setup.sh setup/*.sh setup/tests/*.sh backend/testenv/prepare.sh backend/testenv/control.sh
          bash setup/install-ubuntu.sh --help
          bash setup/tests/test-platform.sh
          bash setup/tests/test-auto-admin.sh
          for script in backend/lokzeitleiste/static/*.js; do node --check "$script"; done
      - name: Translation catalogue reproducibility
        run: |
          python tools/build-translations.py --check
          python tools/build-station-catalog.py --check
          python tools/build-rail-network.py --check
      - name: JavaScript regression tests
        run: |
          for test in backend/tests/*.cjs; do node "$test" || exit 1; done
          node backend/tests/test_brake_sheet_ui.cjs --overlay
      - name: La PDF rendering, offline account isolation and publication form
        run: |
          python backend/tests/check_la_assets.py
          python backend/tests/check_la_instructions_ui.py --output-dir "$RUNNER_TEMP/la-instructions-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: la-instructions-ui
          path: ${{ runner.temp }}/la-instructions-ui/
      - name: Private route knowledge CSV preview, import and offline cache
        run: python backend/tests/check_route_csv_ui.py --output-dir "$RUNNER_TEMP/route-csv-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-csv-ui
          path: ${{ runner.temp }}/route-csv-ui/
      - name: M1 offline rail network and directional route coverage
        run: python backend/tests/check_rail_network_ui.py --output-dir "$RUNNER_TEMP/rail-network-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rail-network-ui
          path: ${{ runner.temp }}/rail-network-ui/
      - name: Large imported map at 4x CPU slowdown
        run: python backend/tests/check_route_import_performance.py --output-dir "$RUNNER_TEMP/route-import-performance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-import-performance
          path: ${{ runner.temp }}/route-import-performance/
      - name: TF beta import, pause, fullscreen, traffic and route checks
        run: python backend/tests/check_portal_beta60_ui.py --output-dir "$RUNNER_TEMP/portal-beta60-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-beta60-ui
          path: ${{ runner.temp }}/portal-beta60-ui/
      - name: GPS demo browser playback
        run: python backend/tests/check_gps_demo_ui.py --output-dir "$RUNNER_TEMP/gps-demo-ui"
      - name: Field error navigation and Android-only update tile
        run: python backend/tests/check_field_error_navigation_ui.py --output-dir "$RUNNER_TEMP/field-error-navigation"
      - name: Check shared GPS demo and read-only stops
        run: |
          python backend/tests/check_gps_demo_sharing_ui.py --output-dir "$RUNNER_TEMP/gps-demo-sharing-ui"
          python backend/tests/check_gps_demo_visibility_ui.py --output-dir "$RUNNER_TEMP/gps-demo-visibility-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gps-demo-ui
          path: ${{ runner.temp }}/gps-demo-ui/
      - name: Offline DS100 browser checks
        run: python backend/tests/check_station_catalog_ui.py --output-dir "$RUNNER_TEMP/station-catalog-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: station-catalog-ui
          path: ${{ runner.temp }}/station-catalog-ui/
      - name: GPS station coordinate contribution checks
        run: python backend/tests/check_station_contributions_ui.py --output-dir "$RUNNER_TEMP/station-contributions-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: station-contributions-ui
          path: ${{ runner.temp }}/station-contributions-ui/
      - name: Updates browser module
        run: python backend/tests/check_updates_ui.py --output-dir "$RUNNER_TEMP/updates-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updates-ui
          path: ${{ runner.temp }}/updates-ui/
      - name: Responsive work report layout
        run: python backend/tests/check_work_report_layout.py --output-dir "$RUNNER_TEMP/work-report-layout"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-report-layout
          path: ${{ runner.temp }}/work-report-layout/
      - name: Train tracking live positions, expiry and read-only map
        run: python backend/tests/check_train_tracking_ui.py --output-dir "$RUNNER_TEMP/train-tracking-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: train-tracking-ui
          path: ${{ runner.temp }}/train-tracking-ui/
      - name: Dispatcher personnel management browser checks
        run: python backend/tests/check_dispatchers_ui.py --output-dir "$RUNNER_TEMP/dispatchers-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatchers-ui
          path: ${{ runner.temp }}/dispatchers-ui/
      - name: Administrative knowledge target isolation and shared map
        run: python backend/tests/check_admin_knowledge_ui.py --output-dir "$RUNNER_TEMP/admin-knowledge-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-knowledge-ui
          path: ${{ runner.temp }}/admin-knowledge-ui/
      - name: Report return, yellow correction row and final duty bounds
        run: python backend/tests/check_report_rework_ui.py --output-dir "$RUNNER_TEMP/report-rework-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-rework-ui
          path: ${{ runner.temp }}/report-rework-ui/
      - name: Administrative work report inbox browser checks
        run: python backend/tests/check_admin_work_reports_ui.py --output-dir "$RUNNER_TEMP/admin-work-reports-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-work-reports-ui
          path: ${{ runner.temp }}/admin-work-reports-ui/
      - name: WGM administration browser checks
        run: python backend/tests/check_wgm_ui.py --output-dir "$RUNNER_TEMP/wgm-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wgm-ui
          path: ${{ runner.temp }}/wgm-ui/
      - name: GPS settings and explicit sharing browser checks
        run: python backend/tests/check_gps_preferences_ui.py --output-dir "$RUNNER_TEMP/gps-preferences-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gps-preferences-ui
          path: ${{ runner.temp }}/gps-preferences-ui/
      - name: Backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: CSV browser to authenticated server and operating point reproducibility
        run: |
          python backend/tests/check_location_editor_ui.py --output-dir "$RUNNER_TEMP/location-editor-ui"
          python backend/tests/check_knowledge_inventory_ui.py --output-dir "$RUNNER_TEMP/knowledge-inventory-ui"
          python tools/build-operating-points.py --check
          PYTHONPATH=backend:backend/tests python backend/tests/check_route_csv_server.py --output-dir "$RUNNER_TEMP/route-csv-server"
      - name: Help overlay and print checks
        run: python backend/tests/check_tf_help_ui.py --output-dir "$RUNNER_TEMP/tf-help-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tf-help-ui
          path: ${{ runner.temp }}/tf-help-ui/
      - name: Notes UI checks
        run: python backend/tests/check_tf_notes_ui.py --output-dir "$RUNNER_TEMP/tf-notes-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tf-notes-ui
          path: ${{ runner.temp }}/tf-notes-ui/
      - name: Day and night mode browser checks
        run: python backend/tests/check_portal_theme_ui.py --output-dir "$RUNNER_TEMP/portal-theme-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-theme-ui
          path: ${{ runner.temp }}/portal-theme-ui/
      - name: Module language browser checks
        run: python backend/tests/check_i18n_ui.py --output-dir "$RUNNER_TEMP/i18n-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: i18n-ui
          path: ${{ runner.temp }}/i18n-ui/
      - name: Header controls layout
        run: python backend/tests/check_header_controls_ui.py --output-dir "$RUNNER_TEMP/header-controls-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: header-controls-ui
          path: ${{ runner.temp }}/header-controls-ui/
      - name: TF administration browser regression
        run: python backend/tests/check_tf_admin_ui.py --output-dir "$RUNNER_TEMP/tf-admin-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tf-admin-ui
          path: ${{ runner.temp }}/tf-admin-ui/
      - name: Wagon list Excel import browser checks
        run: python backend/tests/check_wagon_import_ui.py --output-dir "$RUNNER_TEMP/wagon-import-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wagon-import-ui
          path: ${{ runner.temp }}/wagon-import-ui/
      - name: Compose configuration
        working-directory: backend
        run: |
          bash testenv/prepare.sh
          docker compose --env-file .env.test -f compose.test.yaml config --quiet
      - name: Backend and admin bootstrap tests
        working-directory: backend
        run: |
          python -m unittest discover -s tests -v
